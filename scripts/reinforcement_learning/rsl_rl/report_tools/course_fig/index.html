<!DOCTYPE html><html><head><meta charset="utf-8"><title>SplitMoE obstacle-course schematic (Fig. 7)</title>
<style>body{background:#fafafa;margin:28px;font-family:Arial,Helvetica,sans-serif}h2{color:#333;font-weight:600}.box{max-width:1120px;background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.05)}p{color:#888;font-size:13px}code{background:#f0f0f0;padding:1px 5px;border-radius:3px}</style></head><body>
<h2>Obstacle-course schematic &mdash; Fig. 7</h2><div class="box">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 220" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2d4b2"/><stop offset="1" stop-color="#cbb88d"/>
    </linearGradient>
    <linearGradient id="gObst" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcbd"/><stop offset="1" stop-color="#d2c094"/>
    </linearGradient>
    <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e25b4a"/><stop offset="1" stop-color="#bc3826"/>
    </linearGradient>
    <linearGradient id="gVoid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbe3ef"/><stop offset="1" stop-color="#9cc4da"/>
    </linearGradient>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e556b"/><stop offset="1" stop-color="#2b3b4c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#3a2f1d" flood-opacity="0.22"/>
    </filter>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#555"/>
    </marker>
    <marker id="ahb" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2f7d9e"/>
    </marker>
  </defs>
  <style>
    .lab{font-size:15px;font-weight:700;fill:#3a3a3a;text-anchor:middle}
    .sub{font-size:10.5px;fill:#7a6a4f;text-anchor:middle}
    .dim{font-size:15px;font-style:italic;fill:#555;text-anchor:middle}
    .dimv{font-size:13px;font-style:italic;fill:#2f7d9e;text-anchor:middle}
    .edge{fill:none;stroke:#7a6747;stroke-width:1.1}
    .note{font-size:12px;fill:#888;text-anchor:middle}
    .arr{stroke:#555;stroke-width:1.1;marker-start:url(#ah);marker-end:url(#ah)}
    .arrv{stroke:#2f7d9e;stroke-width:1.1;marker-start:url(#ahb);marker-end:url(#ahb)}
  </style>

  <!-- ===== thin ground band (track) ===== -->
  <g filter="url(#soft)">
    <rect x="8" y="128" width="1024" height="15" rx="3" fill="url(#gGround)"/>
  </g>
  <line x1="8" y1="128" x2="1032" y2="128" stroke="#b9a679" stroke-width="0.8"/>

  <!-- ===== obstacles (left -> right) ===== -->
  <!-- slope -->
  <g filter="url(#soft)">
    <path d="M250,128 L286,92 L356,92 L392,128 Z" fill="url(#gObst)" class="edge"/>
  </g>
  <!-- stairs -->
  <g filter="url(#soft)">
    <path d="M430,128 L430,112 L452,112 L452,96 L474,96 L474,80 L520,80 L520,96 L542,96 L542,112 L564,112 L564,128 Z"
          fill="url(#gObst)" class="edge"/>
  </g>
  <!-- rail (step-over) -->
  <g filter="url(#soft)">
    <rect x="624" y="92" width="13" height="38" rx="4" fill="url(#gObst)" class="edge"/>
  </g>
  <!-- stepping stones: two blocks + void notch -->
  <g filter="url(#soft)">
    <rect x="700" y="118" width="44" height="12" rx="3" fill="url(#gObst)" class="edge"/>
    <rect x="778" y="118" width="44" height="12" rx="3" fill="url(#gObst)" class="edge"/>
  </g>
  <path d="M744,128 L744,162 L778,162 L778,128" fill="url(#gVoid)" stroke="#7fb0c9" stroke-width="0.9"/>
  <rect x="744" y="126" width="34" height="4" fill="#fff" opacity="0.55"/>
  <!-- step-up platform -->
  <g filter="url(#soft)">
    <path d="M872,128 L872,86 L972,86 L972,128 Z" fill="url(#gObst)" class="edge"/>
  </g>
  <!-- crawl-under hurdle: floating bar -->
  <g filter="url(#soft)"><rect x="148" y="78" width="36" height="9" rx="3.5" fill="url(#gBar)"/></g>

  <!-- ===== M20 robot (wheeled-legged, side view) ===== -->
  <g transform="translate(40,0)">
    <!-- legs -->
    <path d="M14,112 L8,127" stroke="#22303d" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M48,112 L54,127" stroke="#22303d" stroke-width="3.4" stroke-linecap="round"/>
    <!-- body -->
    <g filter="url(#soft)"><rect x="6" y="98" width="50" height="18" rx="7" fill="url(#gBody)"/></g>
    <rect x="40" y="92" width="12" height="9" rx="3" fill="#2b3b4c"/> <!-- head/sensor -->
    <circle cx="46" cy="95" r="1.7" fill="#7fd0ff"/>
    <!-- wheels -->
    <circle cx="8" cy="127" r="9" fill="#1c2731" stroke="#3e556b" stroke-width="2"/>
    <circle cx="8" cy="127" r="3" fill="#52708a"/>
    <circle cx="54" cy="127" r="9" fill="#1c2731" stroke="#3e556b" stroke-width="2"/>
    <circle cx="54" cy="127" r="3" fill="#52708a"/>
    <text x="31" y="86" class="sub" fill="#3e556b" font-weight="700">M20</text>
  </g>

  <!-- ===== labels ===== -->
  <text class="lab" x="166" y="52">hurdle</text><text class="sub" x="166" y="66">crawl under</text>
  <text class="lab" x="321" y="52">slope</text><text class="sub" x="321" y="66">up / down</text>
  <text class="lab" x="497" y="52">stairs</text><text class="sub" x="497" y="66">up / down</text>
  <text class="lab" x="630" y="52">rail</text><text class="sub" x="630" y="66">step over</text>
  <text class="lab" x="761" y="48">stepping stones</text><text class="sub" x="761" y="62">jump the void</text>
  <text class="lab" x="922" y="52">step-up</text><text class="sub" x="922" y="66">climb</text>

  <!-- ===== dimension callouts (symbolic) ===== -->
  <line class="arr" x1="200" y1="128" x2="200" y2="82.5"/>
  <text class="dim" x="212" y="110">h<tspan dy="4" font-size="10" font-style="normal">1</tspan></text>
  <line class="arrv" x1="744" y1="150" x2="778" y2="150"/>
  <text class="dimv" x="761" y="146">l<tspan dy="3" font-size="9" font-style="normal">1</tspan></text>
  <line class="arr" x1="982" y1="128" x2="982" y2="86"/>
  <text class="dim" x="994" y="110">h<tspan dy="4" font-size="10" font-style="normal">2</tspan></text>

  <!-- ===== direction of travel ===== -->
  <line x1="40" y1="194" x2="122" y2="194" stroke="#9a9a9a" stroke-width="1.3" marker-end="url(#ah)"/>
  <text class="note" style="text-anchor:start" x="132" y="198">direction of travel</text>
</svg>
</div><p>Edit <code>course.svg</code>, preview here, then export for LaTeX: <code>cairosvg course.svg -o course_schematic.pdf</code></p></body></html>
